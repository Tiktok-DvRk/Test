<body data-version="V19">
<div id="root"></div>
<script>
const KEY="schutzAppExactV1";
function defaultState(){return {pseudo:"",score:0,streak:1,lastActiveDate:"",courses:[],friends:[],loyaltyStamps:0,dsGrades:[],notes:[],sharedExercises:[],pdfs:[],dailyReminder:{enabled:false,time:"18:00",timezone:"Europe/Paris",lastSentKey:""},avatarUrl:"",avatarPath:""}}
function loadState(){try{return {...defaultState(),...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return defaultState()}}
const state = loadState();
let tab="home", modal=null, toastMsg="", timer=null;
let remoteLeaderboard=[];
let remoteBusy=false;
let remoteError="";
let authMode="login";
let authUser=null;
let authLoading=true;
let authMessage="";
let resetMode=false;
let shopCart=[];
let orderSubmitting=false;
let qrPendingUrl="";
let deckSwipeStart=null;
let orderRefreshTimer=null;
let orderChannel=null;
let drawingState=null;
const DEFAULT_SHOP_PRODUCTS=[
{id:'tea-turkish',name:'Thé turc',desc:'Thé turc',price:0.20,emoji:'🫖'},
{id:'tea-mint',name:'Thé à la menthe',desc:'Thé parfumé à la menthe',price:0.20,emoji:'🌿'},
{id:'tea-green',name:'Thé vert',desc:'Thé vert',price:0.20,emoji:'🍃'},
{id:'tea-black',name:'Thé noir',desc:'Thé noir',price:0.20,emoji:'🫖'},
{id:'tea-apple',name:'Thé à la pomme',desc:'Thé parfumé à la pomme',price:0.20,emoji:'🍎'},
{id:'tea-lemon',name:'Thé au citron',desc:'Thé parfumé au citron',price:0.20,emoji:'🍋'},
{id:'tea-peach',name:'Thé à la pêche',desc:'Thé parfumé à la pêche',price:0.20,emoji:'🍑'},
{id:'tea-berry',name:'Thé fruits rouges',desc:'Thé parfumé aux fruits rouges',price:0.20,emoji:'🫐'},
{id:'tea-rose',name:'Thé à la rose',desc:'Thé parfumé à la rose',price:0.20,emoji:'🌹'},
{id:'tea-chai',name:'Thé chai',desc:'Thé épicé',price:0.20,emoji:'☕'},
{id:'coffee',name:'Café',desc:'Café à l’unité',price:0.50,emoji:'☕'}
];
let SHOP_PRODUCTS=[...DEFAULT_SHOP_PRODUCTS];

const SUPABASE_URL = window.SUPABASE_CONFIG?.url || "";
const SUPABASE_KEY = window.SUPABASE_CONFIG?.anonKey || "";
const supabaseClient = (SUPABASE_URL && !SUPABASE_URL.includes("VOTRE_") && SUPABASE_KEY && !SUPABASE_KEY.includes("VOTRE_"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    })
  : null;
const remoteEnabled = !!supabaseClient;

function uid(){return crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random()}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mathText(s){return esc(s).replace(/\n/g,"<br>")}
function textSizeClass(s){const n=String(s||'').replace(/\s+/g,' ').trim().length;return n>700?'long-text':n>320?'medium-text':'short-text'}
function functionUrl(name){const h=location.hostname.toLowerCase();return (h.includes('vercel.app')||h.includes('vercel'))?`/api/${name}`:`/.netlify/functions/${name}`}
function courseById(id){return state.courses.find(x=>x.id===id)}
function deckById(id){for(const c of state.courses){const d=c.decks.find(x=>x.id===id);if(d)return d}}
function allCards(){return state.courses.flatMap(c=>c.decks.flatMap(d=>d.cards))}
function showToast(m){toastMsg=m;render();setTimeout(()=>{toastMsg="";render()},1800)}
async function getAuthUser(){
  if(!supabaseClient){authLoading=false;return null}
  const {data}=await supabaseClient.auth.getSession();
  authUser=data?.session?.user||null;
  authLoading=false;
  return authUser;
}

async function signUpAccount(){
  if(!supabaseClient){authMessage="Le classement/sauvegarde cloud n'est pas encore configuré.";render();return}
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  const pseudo=document.getElementById("authPseudo").value.trim();
  if(!email||!password||!pseudo){authMessage="Remplis ton email, ton mot de passe et ton pseudo.";render();return}
  if(password.length<6){authMessage="Le mot de passe doit contenir au moins 6 caractères.";render();return}
  authLoading=true;authMessage="";
  const {data,error}=await supabaseClient.auth.signUp({
    email,password,
    options:{data:{pseudo}}
  });
  if(error){authLoading=false;authMessage=error.message;render();return}
  if(data?.session){
    authUser=data.session.user;
    state.pseudo=pseudo;
    state.streak=state.streak||1;
    saveLocal();
    await migrateLocalDataToCloud();
    await loadCloudData();
    authLoading=false;
    render();
  }else{
    authLoading=false;
    authMessage="Compte créé. Vérifie ton email puis reconnecte-toi pour accéder à tes cartes.";
    authMode="login";
    render();
  }
}

async function signInAccount(){
  if(!supabaseClient){authMessage="Le classement/sauvegarde cloud n'est pas encore configuré.";render();return}
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  if(!email||!password){authMessage="Entre ton email et ton mot de passe.";render();return}
  authLoading=true;authMessage="";
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){authLoading=false;authMessage="Email ou mot de passe incorrect.";render();return}
  authUser=data.user;
  await loadCloudData();
  await syncMyLoyalty();
  await cloudSaveAll();
  await publishScore();
  authLoading=false;
  render();
}

async function logout(){
  stopOrderLive();
  if(supabaseClient) await supabaseClient.auth.signOut();
  authUser=null;
  state.pseudo="";
  state.courses=[];
  state.score=0;
  state.streak=1;
  saveLocal();
  tab="home";
  render();
}

async function requestPasswordReset(){
  if(!supabaseClient){authMessage="Le service de récupération n'est pas configuré.";render();return}
  const email=document.getElementById("authEmail")?.value.trim();
  if(!email){authMessage="Entre ton email pour recevoir le lien de réinitialisation.";render();return}
  authLoading=true;authMessage="";render();
  const redirectTo=location.origin+location.pathname+"?reset=1";
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
  authLoading=false;
  authMessage=error?error.message:"Si un compte existe avec cette adresse, un lien de réinitialisation vient d'être envoyé. Vérifie aussi les spams.";
  render();
}
async function updatePassword(){
  const password=document.getElementById("resetPassword")?.value||"";
  const confirm=document.getElementById("resetPassword2")?.value||"";
  if(password.length<6){authMessage="Le mot de passe doit contenir au moins 6 caractères.";render();return}
  if(password!==confirm){authMessage="Les deux mots de passe ne correspondent pas.";render();return}
  authLoading=true;authMessage="";render();
  const {error}=await supabaseClient.auth.updateUser({password});
  authLoading=false;
  if(error){authMessage="Erreur : "+error.message;render();return}
  resetMode=false;
  await supabaseClient.auth.signOut();
  authUser=null;
  history.replaceState({},document.title,location.pathname);
  authMessage="Mot de passe modifié ! Tu peux maintenant te connecter.";
  render();
}

async function syncAvatarToLeaderboard(){
  if(!supabaseClient || !authUser) return;
  const {error}=await supabaseClient.from("leaderboard").update({avatar_url:state.avatarUrl||null}).eq("user_id",authUser.id);
  if(error) console.warn("Avatar classement:",error.message);
}

function storageErrorMessage(bucket,error){
  const msg=String(error?.message||error||'Erreur Storage');
  if(/bucket not found|not found/i.test(msg)) return `Le stockage « ${bucket} » n'est pas créé dans Supabase. Lance le fichier SUPABASE_V21_COMPLETE.sql fourni avec cette version.`;
  if(/row-level security|policy|not authorized|permission/i.test(msg)) return `Accès refusé au stockage « ${bucket} ». La migration Supabase V21 doit être exécutée avec le compte administrateur.`;
  return msg;
}
async function uploadProfileAvatar(){
  if(!supabaseClient || !authUser) return;
  const input=document.getElementById("profileAvatarFile");
  const file=input?.files?.[0];
  if(!file){showToast("Choisis une photo de profil.");return}
  if(!file.type.startsWith("image/")){showToast("Choisis une image.");return}
  if(file.size>5*1024*1024){showToast("Photo trop lourde : 5 Mo maximum.");return}
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=authUser.id+"/avatar-"+Date.now()+"."+ext;
  const oldPath=state.avatarPath||"";
  const {error}=await supabaseClient.storage.from("profile-avatars").upload(path,file,{contentType:file.type,upsert:false,cacheControl:"3600"});
  if(error){showToast(storageErrorMessage("profile-avatars",error));return}
  const {data}=supabaseClient.storage.from("profile-avatars").getPublicUrl(path);
  state.avatarUrl=data.publicUrl;
  state.avatarPath=path;
  saveLocal();
  await cloudSaveAll();
  await publishScore();
  await syncAvatarToLeaderboard();
  if(oldPath && oldPath!==path) await supabaseClient.storage.from("profile-avatars").remove([oldPath]);
  showToast("Photo de profil mise à jour ✅");
  render();
}

async function removeProfileAvatar(){
  if(!supabaseClient || !authUser) return;
  const oldPath=state.avatarPath||"";
  state.avatarUrl=""; state.avatarPath="";
  saveLocal(); await cloudSaveAll(); await publishScore(); await syncAvatarToLeaderboard();
  if(oldPath) await supabaseClient.storage.from("profile-avatars").remove([oldPath]);
  showToast("Photo de profil supprimée."); render();
}

async function publishScore(){
  if(!supabaseClient || !state.pseudo) return;
  const pseudo=state.pseudo.trim();
  if(!pseudo) return;
  try{
    const {error}=await supabaseClient.rpc("publish_leaderboard",{
      p_pseudo:pseudo,
      p_score:Math.max(0,Math.floor(Number(state.score)||0)),
      p_streak:Math.max(1,Math.floor(Number(state.streak)||1))
    });
    if(error) throw error;
    remoteError="";
  }catch(e){
    remoteError=e?.message||"Erreur classement";
  }
}

async function refreshLeaderboard(){
  if(!supabaseClient){remoteLeaderboard=[];return}
  remoteBusy=true;
  try{
    const {data,error}=await supabaseClient
      .from("leaderboard")
      .select("pseudo,score,streak,updated_at,avatar_url")
      .order("score",{ascending:false})
      .limit(100);
    if(error) throw error;
    remoteLeaderboard=Array.isArray(data)?data:[];
    remoteError="";
  }catch(e){
    remoteError=e?.message||"Impossible de charger le classement";
    remoteLeaderboard=[];
  }finally{
    remoteBusy=false;
    if(tab==="leader") render();
  }
}

function remoteStatusText(){
  if(!remoteEnabled) return "Classement partagé non configuré — mode local pour le moment.";
  if(remoteBusy) return "Synchronisation du classement…";
  if(remoteError) return "Classement distant indisponible : "+remoteError;
  return "Classement partagé en direct entre les joueurs.";
}

let cloudSaveTimer=null;
let cloudSaveBusy=false;

function scheduleCloudSave(){
  if(!remoteEnabled || !authUser) return;
  if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(async ()=>{
    cloudSaveTimer=null;
    if(cloudSaveBusy || !authUser) return;
    cloudSaveBusy=true;
    try{
      await cloudSaveAll();
      await publishScore();
    }finally{
      cloudSaveBusy=false;
    }
  },350);
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  // Sauvegarde automatique : chaque modification importante est envoyée au cloud
  // sans bouton « synchroniser » à utiliser.
  scheduleCloudSave();
}

function cloudPayload(){
  return {
    pseudo:state.pseudo||"",
    score:Number(state.score)||0,
    streak:Number(state.streak)||1,
    lastActiveDate:state.lastActiveDate||"",
    courses:Array.isArray(state.courses)?state.courses:[],
    friends:Array.isArray(state.friends)?state.friends:[],
    loyaltyStamps:Number(state.loyaltyStamps)||0,
    stamps:Number(state.loyaltyStamps)||0,
    dsGrades:Array.isArray(state.dsGrades)?state.dsGrades:[],
    notes:Array.isArray(state.notes)?state.notes:[],
    sharedExercises:Array.isArray(state.sharedExercises)?state.sharedExercises:[],
    pdfs:Array.isArray(state.pdfs)?state.pdfs:[],
    dailyReminder:state.dailyReminder||{enabled:false,time:"18:00"},

  };
}

async function cloudSaveAll(){
  if(!supabaseClient || !authUser) return;
  const {error}=await supabaseClient.rpc("save_my_player_data",{p_data:cloudPayload()});
  if(error) console.warn("Sauvegarde cloud:",error.message);
}

async function loadCloudData(){
  if(!supabaseClient || !authUser) return false;
  const {data,error}=await supabaseClient
    .from("player_data")
    .select("pseudo,data")
    .eq("user_id",authUser.id)
    .maybeSingle();
  if(error){console.warn("Chargement cloud:",error.message);return false}
  if(data?.data){
    const cloud=data.data;
    if(cloud.pseudo) state.pseudo=cloud.pseudo;
    if(Array.isArray(cloud.courses)) state.courses=cloud.courses;
    if(Array.isArray(cloud.friends)) state.friends=cloud.friends;
    if(typeof cloud.loyaltyStamps==="number") state.loyaltyStamps=cloud.loyaltyStamps; else if(typeof cloud.stamps==="number") state.loyaltyStamps=cloud.stamps;
    if(Array.isArray(cloud.dsGrades)) state.dsGrades=cloud.dsGrades;
    if(Array.isArray(cloud.notes)) state.notes=cloud.notes;
    if(Array.isArray(cloud.sharedExercises)) state.sharedExercises=cloud.sharedExercises;
    if(Array.isArray(cloud.pdfs)) state.pdfs=cloud.pdfs;
    if(cloud.dailyReminder) state.dailyReminder=cloud.dailyReminder;
    if(typeof cloud.avatarUrl==="string") state.avatarUrl=cloud.avatarUrl;
    if(typeof cloud.avatarPath==="string") state.avatarPath=cloud.avatarPath;
    if(typeof cloud.score==="number") state.score=cloud.score;
    if(typeof cloud.streak==="number") state.streak=cloud.streak;
    if(cloud.lastActiveDate) state.lastActiveDate=cloud.lastActiveDate;
    saveLocal();
    return true;
  }
  // New account: preserve any cards created before account creation and upload them.
  if(state.pseudo || state.courses.length || state.score){
    await cloudSaveAll();
    return true;
  }
  return false;
}

async function initAuth(){
  if(!supabaseClient){authLoading=false;return}
  const recoveryRequested=()=>{
    const params=new URLSearchParams(location.search);
    const hash=String(location.hash||"");
    return params.get("reset")==="1" || params.has("code") || hash.includes("type=recovery") || hash.includes("access_token=");
  };
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    authUser=session?.user||null;
    if(event==="PASSWORD_RECOVERY" || recoveryRequested()){
      resetMode=true;
      authMessage="";
      render();
      return;
    }
    if(authUser && !resetMode){
      setTimeout(async()=>{await loadCloudData();await syncMyLoyalty();await loadShopProducts();render();handlePendingDeckShare()},0);
    }else if(!authUser && !resetMode){render()}
  });
  const {data,error}=await supabaseClient.auth.getSession();
  if(error) console.warn("Session auth:",error.message);
  authUser=data?.session?.user||null;
  if(recoveryRequested()){
    resetMode=true;
    authLoading=false;
    render();
    return;
  }
  if(authUser && !resetMode){
    await loadCloudData();
    await syncMyLoyalty();
    await loadShopProducts();
    if(!state.pseudo){const p=authUser.user_metadata?.pseudo||"";if(p){state.pseudo=p;saveLocal();await cloudSaveAll()}}
  }
  authLoading=false;
  render();
}

function openAddCard(did){const c=newCard("","");modal=formModal("Nouvelle Carte 🃏",cardEditorBody(c),async()=>{const f=document.getElementById("mFront").value.trim(),b=document.getElementById("mBack").value.trim();if(!f||!b){showToast("La question et la réponse sont obligatoires.");return}const card=newCard(f,b);const fi=document.getElementById("mFrontImage")?.files?.[0],bi=document.getElementById("mBackImage")?.files?.[0];if(fi)card.frontImageUrl=await uploadCardMedia(card.id,fi,"front-image");if(bi)card.backImageUrl=await uploadCardMedia(card.id,bi,"back-image");const drawing=await getDrawingDataUrl();const side=document.getElementById("drawSide")?.value||"front";if(drawing){const u=await uploadCardMedia(card.id,drawing,side+"-drawing");if(side==="front")card.frontDrawingUrl=u;else card.backDrawingUrl=u}deckById(did).cards.push(card);save();closeModal();openDeck(did)});render();setKeyboard("mFront");setTimeout(setupDrawingCanvas,0)}

async function uploadCardMedia(cardId,fileOrDataUrl,suffix){if(!supabaseClient||!authUser){showToast("Connecte-toi pour ajouter un média.");return ""}try{let blob=fileOrDataUrl;if(typeof fileOrDataUrl==="string"){blob=await (await fetch(fileOrDataUrl)).blob()}const ext=(blob.type||"image/png").includes("jpeg")?"jpg":"png";const path=`${authUser.id}/cards/${cardId}-${suffix}-${Date.now()}.${ext}`;const {error}=await supabaseClient.storage.from("card-media").upload(path,blob,{contentType:blob.type||"image/png",upsert:false,cacheControl:"31536000"});if(error){console.warn("card-media",error.message);showToast("Image non enregistrée : "+error.message);return ""}const {data}=supabaseClient.storage.from("card-media").getPublicUrl(path);return data?.publicUrl||""}catch(e){console.warn(e);showToast("Impossible d’enregistrer le média.");return ""}}
function setupDrawingCanvas(){const canvas=document.getElementById("drawingCanvas");if(!canvas)return;const ratio=Math.max(1,Math.min(2,window.devicePixelRatio||1));const cssW=canvas.clientWidth||900,cssH=canvas.clientHeight||440;canvas.width=Math.round(cssW*ratio);canvas.height=Math.round(cssH*ratio);const ctx=canvas.getContext("2d");ctx.scale(ratio,ratio);ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=4;ctx.strokeStyle="#111827";ctx.fillStyle="#ffffff";ctx.fillRect(0,0,cssW,cssH);drawingState={canvas,ctx,dirty:false,cssW,cssH,lastX:0,lastY:0,snapshots:[]};canvas.onpointerdown=e=>{drawingState.drawing=true;try{drawingState.snapshots.push(ctx.getImageData(0,0,canvas.width,canvas.height))}catch{}const r=canvas.getBoundingClientRect();drawingState.lastX=e.clientX-r.left;drawingState.lastY=e.clientY-r.top;ctx.beginPath();ctx.moveTo(drawingState.lastX,drawingState.lastY);canvas.setPointerCapture?.(e.pointerId)};canvas.onpointermove=e=>{if(!drawingState?.drawing)return;const r=canvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;ctx.lineTo(x,y);ctx.stroke();drawingState.lastX=x;drawingState.lastY=y;drawingState.dirty=true};canvas.onpointerup=()=>{if(drawingState)drawingState.drawing=false};canvas.onpointercancel=()=>{if(drawingState)drawingState.drawing=false}}
function clearDrawingCanvas(){const c=drawingState?.canvas;if(!c)return;const ctx=drawingState.ctx;ctx.save();ctx.clearRect(0,0,drawingState.cssW,drawingState.cssH);ctx.fillStyle="#ffffff";ctx.fillRect(0,0,drawingState.cssW,drawingState.cssH);ctx.restore();drawingState.dirty=false;drawingState.snapshots=[]}
function undoDrawingStroke(){if(!drawingState?.snapshots?.length)return;const img=drawingState.snapshots.pop();drawingState.ctx.putImageData(img,0,0);drawingState.dirty=drawingState.snapshots.length>0}
async function getDrawingDataUrl(){if(!drawingState?.dirty)return "";return drawingState.canvas.toDataURL("image/png")}

function processImport(did){const raw=document.getElementById("importText").value;const blocks=raw.split(/(?=Q\s*:)/i).filter(x=>/^Q\s*:/i.test(x.trim()));let count=0;for(const block of blocks){const m=block.match(/^Q\s*:\s*([\s\S]*?)\s+R\s*:\s*([\s\S]*?)(?:\s*---|$)/i);if(m&&m[1].trim()&&m[2].trim()){deckById(did).cards.push(newCard(m[1].trim(),m[2].trim()));count++}}save();closeModal();openDeck(did);showToast(`${count} carte(s) ajoutée(s) avec succès ! 🎉`)}

function encodeDeckShare(d){
  const payload={v:1,name:d.name,cards:d.cards.map(c=>({frontText:c.frontText,backText:c.backText}))};
  return LZString.compressToEncodedURIComponent(JSON.stringify(payload));
}

async function handlePendingDeckShare(){
  const hash=location.hash||'';
  if(hash.startsWith('#deck=')){const p=decodeDeckShare(hash.slice(6));if(!p)return;sessionStorage.setItem('pendingDeckShare',JSON.stringify(p));history.replaceState(null,'',location.pathname+location.search)}
  else if(hash.startsWith('#d=')){const code=decodeURIComponent(hash.slice(3));if(!code)return;if(!supabaseClient){showToast('Connexion cloud indisponible');return}const {data,error}=await supabaseClient.rpc('get_deck_share',{p_code:code});history.replaceState(null,'',location.pathname+location.search);if(error||!data||!Array.isArray(data.cards)){console.error('get_deck_share',error);showToast('Lien de deck invalide ou expiré');return}sessionStorage.setItem('pendingDeckShare',JSON.stringify(data))}
  else if(hash.startsWith('#c=')){const code=decodeURIComponent(hash.slice(3));if(!code)return;if(!supabaseClient){showToast('Connexion cloud indisponible');return}const {data,error}=await supabaseClient.rpc('get_course_share',{p_code:code});history.replaceState(null,'',location.pathname+location.search);if(error||!data||!Array.isArray(data.decks)){console.error('get_course_share',error);showToast('Lien de cours invalide ou expiré');return}sessionStorage.setItem('pendingCourseShare',JSON.stringify(data))}
  else return;
  setTimeout(()=>{const pendingCourse=JSON.parse(sessionStorage.getItem('pendingCourseShare')||'null');const pendingDeck=JSON.parse(sessionStorage.getItem('pendingDeckShare')||'null');if(pendingCourse){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>📚 Cours reçu</h2><button class="close" onclick="sessionStorage.removeItem('pendingCourseShare');closeModal()">×</button></div><p>Tu as reçu le cours <b>${esc(pendingCourse.name||'sans nom')}</b> avec ${(pendingCourse.decks||[]).length} chapitre(s).</p><button class="btn primary full" onclick="importPendingCourseShare()">➕ Ajouter le cours complet</button><button class="btn gray full" style="margin-top:8px" onclick="sessionStorage.removeItem('pendingCourseShare');closeModal()">Annuler</button></div></div>`}else if(pendingDeck){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Paquet reçu 📚</h2><button class="close" onclick="sessionStorage.removeItem('pendingDeckShare');closeModal()">×</button></div><p>Tu as reçu le paquet <b>${esc(pendingDeck.name||'sans nom')}</b> avec ${pendingDeck.cards.length} carte(s).</p><button class="btn primary full" onclick="importPendingDeckShare()">➕ Ajouter à mes cartes</button><button class="btn gray full" style="margin-top:8px" onclick="sessionStorage.removeItem('pendingDeckShare');closeModal()">Annuler</button></div></div>`}else return;render()},250)
}
function importPendingCourseShare(){const p=JSON.parse(sessionStorage.getItem('pendingCourseShare')||'null');if(!p)return;let name=p.name||'Cours partagé',base=name,n=2;while(state.courses.some(x=>x.name===name))name=`${base} (${n++})`;const c={id:uid(),name,desc:p.desc||'Cours partagé',decks:(p.decks||[]).map(d=>({id:uid(),name:d.name||'Chapitre',cards:(d.cards||[]).map(x=>({...newCard(String(x.frontText||''),String(x.backText||'')),frontImageUrl:x.frontImageUrl||'',backImageUrl:x.backImageUrl||'',frontDrawingUrl:x.frontDrawingUrl||'',backDrawingUrl:x.backDrawingUrl||''}))}))};state.courses.push(c);sessionStorage.removeItem('pendingCourseShare');save();closeModal();showToast('Cours complet ajouté ! 🎉')}

let deckLearning={did:null,index:0,revealed:false};
function startDeckLearning(did){const d=deckById(did);if(!d||!d.cards.length){showToast('Ce deck ne contient aucune carte');return}deckLearning={did,index:0,revealed:false};renderDeckLearning()}
function renderDeckLearning(){
  const d=deckById(deckLearning.did); if(!d){closeModal();return}
  if(deckLearning.index>=d.cards.length){modal=`<div class="deck-learning-overlay"><div class="deck-learning-top"><b>🎓 ${esc(d.name)}</b><button class="btn gray small" type="button" onclick="closeModal()">Fermer</button></div><div class="deck-learning-card-wrap"><div class="deck-learning-card" style="text-align:center"><div style="font-size:76px">🎉</div><h2>Deck terminé</h2><p>Tu viens de revoir les ${d.cards.length} cartes.</p><button class="btn primary full" type="button" onclick="deckLearning.index=0;deckLearning.revealed=false;renderDeckLearning()">🔁 Recommencer</button></div></div></div>`;render();return}
  const c=d.cards[deckLearning.index];
  const grades=deckLearning.revealed?`<div class="grade-grid" style="width:min(920px,96vw);margin:8px auto 0"><button class="btn red" type="button" onclick="rateDeckLearning('again')">Oublié</button><button class="btn orange" type="button" onclick="rateDeckLearning('hard')">Moyen</button><button class="btn primary" type="button" onclick="rateDeckLearning('good')">Correct</button><button class="btn green" type="button" onclick="rateDeckLearning('easy')">Parfait</button></div>`:'';
  const dx=Number(deckLearning.dragX||0),dy=Number(deckLearning.dragY||0),angle=Math.max(-14,Math.min(14,dx/18));
  const transform=(deckLearning.settling)?`transform:translate3d(${dx}px,${dy}px,0) rotate(${angle}deg);opacity:${Math.max(.35,1-(Math.abs(dx)+Math.abs(dy))/850)};transition:transform .22s ease,opacity .22s ease;`:'';
  const side=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'up':'down');
  const label=(deckLearning.dragging&&Math.max(Math.abs(dx),Math.abs(dy))>20)?`<div class="deck-swipe-label ${side}" style="opacity:${Math.min(1,Math.max(Math.abs(dx),Math.abs(dy))/90)}">${side==='right'?'PARFAIT':side==='left'?'OUBLIÉ':side==='up'?'CORRECT':'MOYEN'}</div>`:'';
  modal=`<div class="deck-learning-overlay"><div class="deck-learning-top"><div><b>🎓 ${esc(d.name)}</b><div class="sub">Carte ${deckLearning.index+1} / ${d.cards.length}</div></div><button class="btn gray small" type="button" onclick="closeModal()">✕</button></div><div class="progress" style="background:rgba(255,255,255,.18)"><div style="width:${deckLearning.index/d.cards.length*100}%;background:#fff"></div></div><div class="deck-learning-card-wrap"><div class="deck-swipe-stage">${label}<div id="deckLearningCard" class="deck-learning-card ${deckLearning.dragging?'swiping':''}" style="touch-action:none;${transform}" onpointerdown="deckLearningPointerDown(event)" onpointermove="deckLearningPointerMove(event)" onpointerup="deckLearningPointerUp(event)" onpointercancel="deckLearningPointerCancel()"><div class="learning-front learning-content math center ${textSizeClass(c.frontText)}">${mathText(c.frontText)}${cardMediaHtml(c,'front')}</div>${deckLearning.revealed?`<div class="learning-back learning-content math center ${textSizeClass(c.backText)}">${mathText(c.backText)}${cardMediaHtml(c,'back')}</div>`:`<button class="btn primary full" type="button" style="margin-top:28px" onclick="event.stopPropagation();deckLearning.revealed=true;deckLearning.dragX=0;deckLearning.dragY=0;renderDeckLearning()">👀 Révéler la réponse</button>`}</div></div></div>${grades}<div class="deck-learning-hint">${deckLearning.revealed?'Glisse : ← Oublié · ↓ Moyen · ↑ Correct · → Parfait':'Révèle la réponse puis glisse la carte pour noter ta maîtrise'}</div><div class="swipe-map"><span>⬅️ Oublié</span><span>⬇️ Moyen</span><span>⬆️ Correct</span><span>➡️ Parfait</span></div></div>`;
  render(); if(window.MathJax)MathJax.typesetPromise().catch(()=>{});
}
function deckLearningPointerDown(e){if(!deckLearning.revealed||deckLearning.settling)return;deckSwipeStart={x:e.clientX,y:e.clientY};deckLearning.dragging=true;deckLearning.dragX=0;deckLearning.dragY=0;try{e.currentTarget.setPointerCapture?.(e.pointerId)}catch{}}
function deckLearningPointerMove(e){if(!deckLearning.dragging||!deckSwipeStart)return;deckLearning.dragX=e.clientX-deckSwipeStart.x;deckLearning.dragY=e.clientY-deckSwipeStart.y;const card=document.getElementById('deckLearningCard');if(!card)return;const dx=deckLearning.dragX,dy=deckLearning.dragY,angle=Math.max(-14,Math.min(14,dx/18));card.style.transform=`translate3d(${dx}px,${dy}px,0) rotate(${angle}deg)`;card.style.opacity=String(Math.max(.35,1-(Math.abs(dx)+Math.abs(dy))/850));const stage=card.parentElement;stage?.querySelectorAll('.deck-swipe-label').forEach(l=>l.style.opacity='0');const side=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'up':'down');const lab=stage?.querySelector('.deck-swipe-label.'+side);if(lab)lab.style.opacity=String(Math.min(1,Math.max(Math.abs(dx),Math.abs(dy))/90));}
function deckLearningPointerUp(e){if(!deckLearning.dragging||!deckSwipeStart)return;const dx=e.clientX-deckSwipeStart.x,dy=e.clientY-deckSwipeStart.y;deckSwipeStart=null;deckLearning.dragging=false;const distance=Math.max(Math.abs(dx),Math.abs(dy));if(distance<70){deckLearning.dragX=0;deckLearning.dragY=0;deckLearning.settling=true;renderDeckLearning();setTimeout(()=>{deckLearning.settling=false},230);return}let r;if(Math.abs(dx)>Math.abs(dy))r=dx>0?'easy':'again';else r=dy<0?'good':'hard';const len=Math.hypot(dx,dy)||1;deckLearning.dragX=(dx/len)*Math.max(900,innerWidth*1.15);deckLearning.dragY=(dy/len)*Math.max(900,innerHeight*1.15);deckLearning.settling=true;renderDeckLearning();setTimeout(()=>rateDeckLearning(r),180)}
function deckLearningPointerCancel(){deckSwipeStart=null;deckLearning.dragging=false;deckLearning.dragX=0;deckLearning.dragY=0;renderDeckLearning()}
function rateDeckLearning(r){const d=deckById(deckLearning.did),c=d?.cards?.[deckLearning.index];if(!c)return;Object.assign(c,fsrsEvaluate(c,r));c.reps++;if(r==='again')c.lapses++;c.reviewLogs.push({date:new Date().toISOString(),rating:r});save();deckLearning.index++;deckLearning.revealed=false;deckLearning.dragX=0;deckLearning.dragY=0;deckLearning.settling=false;renderDeckLearning()}

async function loadMyOrders(silent=false){

    const session=await supabaseClient.auth.getSession();

    if(!user){box.innerHTML='<div class="auth-error">Connecte-toi pour voir tes commandes.</div>';return}
    const r=await Promise.race([
      supabaseClient.rpc('get_my_shop_orders'),

function recallS(d,s,r,rt,w){const hp=rt===2?w[15]:1,eb=rt===4?w[16]:1;return Math.max(.1,s*(1+Math.exp(w[8])*(11-d)*Math.pow(s,-w[9])*(Math.exp((1-r)*w[10])-1)*hp*eb))}
function forgetS(d,s,r,w){return Math.min(s,Math.max(.1,w[11]*Math.pow(d,-w[12])*(Math.pow(s+1,w[13])-1)*Math.exp((1-r)*w[14])))}
function fsrsEvaluate(c,r){
  const w=[.4,.6,2.4,5.8,4.93,.94,.86,.01,1.49,.14,.94,2.18,.05,.34,1.26,.29,2.61];
  const rating={again:1,hard:2,good:3,easy:4}[r];
  const stateRaw=Number(c.fsrsStateRaw)||0;
  const last=c.lastReviewDate?new Date(c.lastReviewDate):null;
  const elapsed=last&&!Number.isNaN(last.getTime())?Math.max(0,(Date.now()-last.getTime())/86400000):0;
  const stability=Math.max(.1,Number(c.stability)||0);
  const retr=stability>0?Math.pow(1+elapsed/(9*stability),-1):0;
  let d=Math.min(Math.max(Number(c.difficulty)||5,1),10),s=stability,ns=stateRaw;
  const initD=Math.min(Math.max(w[4]-(rating-3)*w[5],1),10);
  const calcD=(cur,rt)=>Math.min(Math.max(cur-w[6]*(rt-3)+w[7]*(initD-(cur-w[6]*(rt-3))),1),10);
  d=calcD(d,rating);
  const initS=Math.max(.1,w[rating-1]);
  if(stateRaw===0){s=initS;ns=rating===1?1:2}
  else if(stateRaw===1||stateRaw===3){if(rating===1){s=initS;ns=3}else{s=recallS(d,s,retr,rating,w);ns=2}}
  else if(rating===1){s=forgetS(d,s,retr,w);ns=3}
  else{s=recallS(d,s,retr,rating,w);ns=2}
  const interval=(ns===1||ns===3)?(rating===1?5/1440:15/1440):Math.max(1,s*(Math.pow(.9,-1)-1)*9);
  return {difficulty:d,stability:s,fsrsStateRaw:ns,lastReviewDate:new Date().toISOString(),dueDate:new Date(Date.now()+interval*86400000).toISOString()};
}

  if(me.error||me.data!==true){box.innerHTML='<div class="sub">Seul un administrateur peut nommer ou retirer des rôles.</div>';return}
  const r=await adminRpcSafe('admin_list_roles');
  if(r.error){box.innerHTML='<div class="auth-error">'+esc(r.error.message)+'</div>';return}
  box.innerHTML=(r.data||[]).map(u=>`<div class="card"><div class="row"><div class="main"><b>${esc(u.pseudo||'Sans pseudo')}</b><div class="mini">${esc(u.email||'')} · ${esc(u.role||'user')}</div></div><select id="role-${u.user_id}" style="max-width:150px"><option value="user" ${u.role==='user'?'selected':''}>Utilisateur</option><option value="moderator" ${u.role==='moderator'?'selected':''}>Modo</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div><button class="btn purple full" style="margin-top:8px" onclick="adminSaveRole('${u.user_id}')">Enregistrer le rôle</button></div>`).join('')||'<div class="empty">Aucun compte.</div>';
}
async function adminSaveRole(id){const role=document.getElementById('role-'+id)?.value||'user';const r=await adminRpcSafe('admin_set_user_role',{p_user_id:id,p_role:role});if(r.error){showToast('Rôle : '+r.error.message);return}showToast('Rôle enregistré : '+role+' ✅');closeModal();await loadAdminRoles();}
function adminOrderCard(o){
  const items=Array.isArray(o.items)?o.items:[];
  const total=Number(o.total||0).toFixed(2);
  const created=o.created_at?new Date(o.created_at).toLocaleString('fr-FR'):'—';
  return `<div class="card admin-order" data-order-id="${esc(o.id)}">
    <div class="row between" style="gap:10px;align-items:flex-start">
      <div class="main"><b>📦 ${esc(o.customer_name||o.pseudo||'Client')}</b><div class="mini">Commande #${esc(String(o.id||'').slice(0,8))} · ${created}</div></div>
      <span class="pill">${orderStatusLabel(o.status)}</span>
    </div>
    <div class="mini" style="margin-top:8px">👤 ${esc(o.pseudo||'—')} · ✉️ ${esc(o.customer_email||'—')}</div>
    <p>📍 <b>${esc(o.address||'—')}</b>, ${esc(o.city||'—')}</p>
    <p>💶 <b>${total} €</b></p>
    <div class="sub">🛒 ${items.map(i=>`${esc(i.name)} × ${Number(i.qty)||0}`).join(' · ')||'—'}</div>
    ${o.note?`<p class="sub">📝 ${esc(o.note)}</p>`:''}
    <div class="grid2" style="margin-top:10px">
      <select id="status-${esc(o.id)}" aria-label="Statut de la commande">${orderStatusOptions(o.status)}</select>
      <button class="btn primary" onclick="adminChangeOrder('${esc(o.id)}',document.getElementById('status-${esc(o.id)}').value)">💾 Enregistrer</button>
    </div>
    <button class="btn red full" style="margin-top:8px" onclick="adminDeleteOrder('${esc(o.id)}')">🗑️ Supprimer la commande</button>
  </div>`;
}
let adminOrdersLoading=false;
async function loadAdminOrders(){
  const box=document.getElementById('adminOrders');
  if(adminOrdersLoading)return;
  adminOrdersLoading=true;
  if(!box)return;
  box.innerHTML='<div class="empty">Chargement des commandes…</div>';
  let result=await adminRpcSafe('admin_list_orders');
  // Secours utile si PostgREST a un cache de fonction ancien : on tente la lecture directe.
  if(result.error){
    const fallback=await supabaseClient.from('shop_orders').select('id,user_id,pseudo,customer_name,customer_email,address,city,items,total,note,status,created_at,updated_at').order('created_at',{ascending:false});
    if(!fallback.error){result={data:fallback.data,error:null};}
  }
  if(result.error){
    box.innerHTML='<div class="auth-error"><b>Impossible de charger les commandes</b><br>'+esc(result.error.message||'Erreur inconnue')+'<br><small>Si tu viens de lancer la migration Supabase, recharge la page puis réessaie.</small></div>';
    adminOrdersLoading=false;
    return;
  }
  const rawOrders=Array.isArray(result.data)?result.data:[];const seenOrders=new Set();const orders=rawOrders.filter(o=>{const id=String(o.id||'');if(!id||seenOrders.has(id))return false;seenOrders.add(id);return true;});
  box.innerHTML=`<div class="row between" style="margin-bottom:10px"><b>${orders.length} commande(s)</b><button class="btn secondary small" onclick="loadAdminOrders()">🔄 Actualiser</button></div>${orders.map(adminOrderCard).join('')||'<div class="empty">Aucune commande pour le moment.</div>'}`;
  adminOrdersLoading=false;
}
async function adminChangeOrder(id,status){
  const r=await adminRpcSafe('admin_update_order_status',{p_order_id:id,p_status:status});
  if(r.error){showToast('Commande : '+r.error.message);return}
  const o=Array.isArray(r.data)?r.data[0]:r.data;
  if(o){
    try{
      const res=await fetch(functionUrl('send-order-status'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:o.customer_email,name:o.customer_name,pseudo:o.pseudo,status:o.status,orderId:id})});
      const d=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(d.error||'Mail client non envoyé');
    }catch(e){
      showToast('Statut enregistré, mais mail non envoyé : '+e.message);
      await loadAdminOrders();
      return;
    }
  }
  showToast('Commande mise à jour : '+orderStatusLabel(status));
  closeModal();
  await loadAdminOrders();
}
async function adminDeleteOrder(id){
  if(!confirm('Supprimer définitivement cette commande ? Cette action est irréversible.'))return;
  const r=await adminRpcSafe('admin_delete_order',{p_order_id:id});
  if(r.error){showToast('Suppression : '+r.error.message);return}
  showToast('Commande supprimée 🗑️');
  await loadAdminOrders();
}
function openGrades(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Notes de DS 📈</h2><button class="close" onclick="closeModal()">×</button></div><div class="grade-grid">${state.dsGrades.map((g,i)=>`<div class="card"><b>${esc(g.name)}</b><div>${g.grade}/${g.max}</div><button class="btn gray small" onclick="deleteGrade(${i})">Supprimer</button></div>`).join('')}</div><input id="gName" placeholder="DS Maths"><input id="gGrade" type="number" step="0.1" placeholder="Note obtenue" style="margin-top:8px"><input id="gMax" type="number" step="0.1" value="20" placeholder="Barème" style="margin-top:8px"><button class="btn primary full" style="margin-top:8px" onclick="addGrade()">＋ Ajouter</button><div class="card"><b>Évolution</b><div style="height:180px;display:flex;align-items:end;gap:8px">${state.dsGrades.map(g=>{const h=Math.max(8,Math.min(100,(Number(g.grade)/Number(g.max||20))*100));return `<div title="${esc(g.name)}" style="flex:1;height:${h}%;background:#4f46e5;border-radius:8px 8px 2px 2px"></div>`}).join('')}</div></div></div></div>`;render()}
function addGrade(){const n=document.getElementById('gName').value.trim(),g=Number(document.getElementById('gGrade').value),m=Number(document.getElementById('gMax').value||20);if(!n||!Number.isFinite(g)||!m)return;state.dsGrades.push({name:n,grade:g,max:m,date:new Date().toISOString()});save();cloudSaveAll();openGrades()}function deleteGrade(i){state.dsGrades.splice(i,1);save();cloudSaveAll();openGrades()}
function openNotes(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Pense-bête / Cahier de texte 📝</h2><button class="close" onclick="closeModal()">×</button></div>${state.notes.map((n,i)=>`<div class="list-item"><div class="main"><b>${esc(n.title)}</b><div class="sub">${esc(n.text)}</div></div><button class="btn gray small" onclick="deleteNote(${i})">×</button></div>`).join('')}<input id="nTitle" placeholder="Titre"><textarea id="nText" placeholder="Travail à faire, devoir, rappel…" style="min-height:100px;margin-top:8px"></textarea><button class="btn primary full" onclick="addNote()">＋ Ajouter</button></div></div>`;render()}
function addNote(){const t=document.getElementById('nTitle').value.trim(),x=document.getElementById('nText').value.trim();if(!t||!x)return;state.notes.push({title:t,text:x,date:new Date().toISOString()});save();cloudSaveAll();openNotes()}function deleteNote(i){state.notes.splice(i,1);save();cloudSaveAll();openNotes()}
function openStudyTimer(){const saved=Math.max(1,Math.min(1440,Number(localStorage.getItem('schutzTimerMinutes')||25)));window.studyTimerMinutes=saved;window.studyTimerSeconds=saved*60;modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Timer de révision ⏱️</h2><button class="close" onclick="clearInterval(window.studyTimerInterval);closeModal()">×</button></div><p class="sub">Choisis librement la durée de ta session.</p><label><b>Durée (minutes)</b><input id="studyTimerMinutes" type="number" min="1" max="1440" step="1" value="${saved}" style="margin-top:8px"></label><div id="studyTimerValue" class="timer-big" style="margin-top:10px">${fmtTimer(window.studyTimerSeconds)}</div><div class="grid2"><button class="btn primary" onclick="applyStudyTimerDuration();startStudyTimer()">▶️ Démarrer</button><button class="btn gray" onclick="resetStudyTimer()">↺ Reset</button></div><button class="btn secondary full" style="margin-top:8px" onclick="applyStudyTimerDuration()">💾 Appliquer la durée</button></div></div>`;render()}
function applyStudyTimerDuration(){const input=document.getElementById('studyTimerMinutes');const minutes=Math.max(1,Math.min(1440,Math.round(Number(input?.value||25))));window.studyTimerMinutes=minutes;window.studyTimerSeconds=minutes*60;localStorage.setItem('schutzTimerMinutes',String(minutes));const e=document.getElementById('studyTimerValue');if(e)e.textContent=fmtTimer(window.studyTimerSeconds)}
function startStudyTimer(){applyStudyTimerDuration();clearInterval(window.studyTimerInterval);window.studyTimerInterval=setInterval(()=>{window.studyTimerSeconds=Math.max(0,window.studyTimerSeconds-1);const e=document.getElementById('studyTimerValue');if(e)e.textContent=fmtTimer(window.studyTimerSeconds);if(window.studyTimerSeconds===0){clearInterval(window.studyTimerInterval);showToast('Session terminée ! 🎉')}},1000)}
function resetStudyTimer(){clearInterval(window.studyTimerInterval);const minutes=Math.max(1,Math.min(1440,Number(window.studyTimerMinutes||25)));window.studyTimerSeconds=minutes*60;const e=document.getElementById('studyTimerValue');if(e)e.textContent=fmtTimer(window.studyTimerSeconds)}
function fmtTimer(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function openPdfManager(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>PDF de cours 📄</h2><button class="close" onclick="closeModal()">×</button></div><input id="pdfFile" type="file" accept="application/pdf"><input id="pdfName" placeholder="Nom du cours / document" style="margin-top:8px"><button class="btn primary full" style="margin-top:8px" onclick="uploadCoursePdf()">⬆️ Déposer le PDF</button><div class="section-title">Mes PDF</div>${state.pdfs.map((f,i)=>`<div class="list-item"><div class="main"><b>${esc(f.name)}</b><div class="mini">${new Date(f.date).toLocaleDateString('fr-FR')}</div></div><button class="btn secondary small" onclick="openPdf('${encodeURIComponent(f.path)}')">Ouvrir</button><button class="btn red small" onclick="deleteCoursePdf(${i})">🗑️</button></div>`).join('')||'<div class="empty">Aucun PDF.</div>'}</div></div>`;render()}
async function uploadCoursePdf(){const file=document.getElementById('pdfFile')?.files?.[0],name=document.getElementById('pdfName')?.value.trim()||file?.name;if(!file||file.type!=='application/pdf'||!authUser){showToast('Choisis un PDF et vérifie ta connexion.');return}const path=authUser.id+'/'+uid()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await supabaseClient.storage.from('course-pdfs').upload(path,file,{contentType:'application/pdf',upsert:false});if(error){console.error('[course-pdfs]',error);showToast(storageErrorMessage('course-pdfs',error));return}state.pdfs.push({name,path,date:new Date().toISOString()});save();await cloudSaveAll();openPdfManager();showToast('PDF ajouté 📄')}
async function openPdf(encoded){const path=decodeURIComponent(encoded);const {data,error}=await supabaseClient.storage.from('course-pdfs').createSignedUrl(path,3600);if(error){showToast(error.message);return}window.open(data.signedUrl,'_blank')}
async function deleteCoursePdf(i){const f=state.pdfs?.[i];if(!f)return;if(!confirm(`Supprimer le PDF « ${f.name} » ?`))return;const {error}=await supabaseClient.storage.from('course-pdfs').remove([f.path]);if(error){showToast('Suppression : '+error.message);return}state.pdfs.splice(i,1);save();await cloudSaveAll();openPdfManager();showToast('PDF supprimé 🗑️')}
async function openExerciseSpace(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Exercices communs 🤝</h2><button class="close" onclick="closeModal()">×</button></div><input id="exFile" type="file" accept=".pdf,image/*,.doc,.docx"><input id="exName" placeholder="Nom de l'exercice" style="margin-top:8px"><button class="btn primary full" style="margin-top:8px" onclick="uploadExercise()">⬆️ Déposer</button><div class="section-title">Fichiers partagés</div><div id="exerciseList">Chargement…</div></div></div>`;render();loadExercises()}
async function loadExercises(){const box=document.getElementById('exerciseList');if(!box)return;const {data,error}=await supabaseClient.storage.from('shared-exercises').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});if(error){console.error('[shared-exercises:list]',error);box.innerHTML='<div class="auth-error"><b>Impossible de lire le dépôt commun</b><br>'+esc(storageErrorMessage('shared-exercises',error))+'<br><small>Bucket utilisé : shared-exercises</small></div>';return}box.innerHTML=(data||[]).map(f=>`<div class="list-item"><div class="main"><b>${esc(f.name)}</b></div><button class="btn secondary small" onclick="openExercise('${encodeURIComponent(f.name)}')">Ouvrir</button><button class="btn red small" onclick="deleteExercise('${encodeURIComponent(f.name)}')">🗑️</button></div>`).join('')||'<div class="empty">Aucun exercice partagé.</div>'}
async function uploadExercise(){const file=document.getElementById('exFile')?.files?.[0],name=document.getElementById('exName')?.value.trim()||file?.name;if(!file||!authUser)return;const path=uid()+'-'+name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await supabaseClient.storage.from('shared-exercises').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(error){console.error('[shared-exercises:upload]',error);showToast(storageErrorMessage('shared-exercises',error));return}await loadExercises();showToast('Exercice partagé 🤝')}
async function openExercise(encoded){const path=decodeURIComponent(encoded);const {data}=supabaseClient.storage.from('shared-exercises').getPublicUrl(path);window.open(data.publicUrl,'_blank')}
async function deleteExercise(encoded){const path=decodeURIComponent(encoded);if(!confirm('Supprimer ce document partagé ?'))return;const {error}=await supabaseClient.storage.from('shared-exercises').remove([path]);if(error){showToast('Suppression : '+error.message);return}await loadExercises();showToast('Document supprimé 🗑️')}

initAuth();
</script>
