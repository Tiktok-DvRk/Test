<body data-version="V19">
<div id="root"></div>
<script>
const KEY="schutzAppExactV1";
function defaultState(){return {pseudo:"",score:0,streak:1,lastActiveDate:"",courses:[],friends:[],loyaltyStamps:0,dsGrades:[],notes:[],sharedExercises:[],pdfs:[],dailyReminder:{enabled:false,time:"18:00",timezone:"Europe/Paris",lastSentKey:""},avatarUrl:"",avatarPath:""}}
function loadState(){try{return {...defaultState(),...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{return defaultState()}}
const state = loadState();
let tab="home", modal=null, toastMsg="", timer=null;
let remoteLeaderboard=[];
let remoteBusy=false;
let remoteError="";
let authMode="login";
let authUser=null;
let authLoading=true;
let authMessage="";
let resetMode=false;
let shopCart=[];

const SUPABASE_URL = window.SUPABASE_CONFIG?.url || "";
const SUPABASE_KEY = window.SUPABASE_CONFIG?.anonKey || "";
const supabaseClient = (SUPABASE_URL && !SUPABASE_URL.includes("VOTRE_") && SUPABASE_KEY && !SUPABASE_KEY.includes("VOTRE_"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
    })
  : null;
const remoteEnabled = !!supabaseClient;

function uid(){return crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random()}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mathText(s){return esc(s).replace(/\n/g,"<br>")}
function courseById(id){return state.courses.find(x=>x.id===id)}
function deckById(id){for(const c of state.courses){const d=c.decks.find(x=>x.id===id);if(d)return d}}
function allCards(){return state.courses.flatMap(c=>c.decks.flatMap(d=>d.cards))}
function showToast(m){toastMsg=m;render();setTimeout(()=>{toastMsg="";render()},1800)}
async function getAuthUser(){
  if(!supabaseClient){authLoading=false;return null}
  const {data}=await supabaseClient.auth.getSession();
  authUser=data?.session?.user||null;
  authLoading=false;
  return authUser;
}

async function signUpAccount(){
  if(!supabaseClient){authMessage="Le classement/sauvegarde cloud n'est pas encore configuré.";render();return}
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  const pseudo=document.getElementById("authPseudo").value.trim();
  if(!email||!password||!pseudo){authMessage="Remplis ton email, ton mot de passe et ton pseudo.";render();return}
  if(password.length<6){authMessage="Le mot de passe doit contenir au moins 6 caractères.";render();return}
  authLoading=true;authMessage="";
  const {data,error}=await supabaseClient.auth.signUp({
    email,password,
    options:{data:{pseudo}}
  });
  if(error){authLoading=false;authMessage=error.message;render();return}
  if(data?.session){
    authUser=data.session.user;
    state.pseudo=pseudo;
    state.streak=state.streak||1;
    saveLocal();
    await migrateLocalDataToCloud();
    await loadCloudData();
    authLoading=false;
    render();
  }else{
    authLoading=false;
    authMessage="Compte créé. Vérifie ton email puis reconnecte-toi pour accéder à tes cartes.";
    authMode="login";
    render();
  }
}

async function signInAccount(){
  if(!supabaseClient){authMessage="Le classement/sauvegarde cloud n'est pas encore configuré.";render();return}
  const email=document.getElementById("authEmail").value.trim();
  const password=document.getElementById("authPassword").value;
  if(!email||!password){authMessage="Entre ton email et ton mot de passe.";render();return}
  authLoading=true;authMessage="";
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){authLoading=false;authMessage="Email ou mot de passe incorrect.";render();return}
  authUser=data.user;
  await loadCloudData();
  await syncMyLoyalty();
  await cloudSaveAll();
  await publishScore();
  authLoading=false;
  render();
}

async function logout(){
  if(supabaseClient) await supabaseClient.auth.signOut();
  authUser=null;
  state.pseudo="";
  state.courses=[];
  state.score=0;
  state.streak=1;
  saveLocal();
  tab="home";
  render();
}

async function requestPasswordReset(){
  if(!supabaseClient){authMessage="Le service de récupération n'est pas configuré.";render();return}
  const email=document.getElementById("authEmail")?.value.trim();
  if(!email){authMessage="Entre ton email pour recevoir le lien de réinitialisation.";render();return}
  authLoading=true;authMessage="";render();
  const redirectTo=location.origin+location.pathname+"?reset=1";
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo});
  authLoading=false;
  authMessage=error?error.message:"Si un compte existe avec cette adresse, un lien de réinitialisation vient d'être envoyé. Vérifie aussi les spams.";
  render();
}
async function updatePassword(){
  const password=document.getElementById("resetPassword")?.value||"";
  const confirm=document.getElementById("resetPassword2")?.value||"";
  if(password.length<6){authMessage="Le mot de passe doit contenir au moins 6 caractères.";render();return}
  if(password!==confirm){authMessage="Les deux mots de passe ne correspondent pas.";render();return}
  authLoading=true;authMessage="";render();
  const {error}=await supabaseClient.auth.updateUser({password});
  authLoading=false;
  if(error){authMessage="Erreur : "+error.message;render();return}
  resetMode=false;
  await supabaseClient.auth.signOut();
  authUser=null;
  history.replaceState({},document.title,location.pathname);
  authMessage="Mot de passe modifié ! Tu peux maintenant te connecter.";
  render();
}
function resetPage(){return `<div class="welcome"><div class="welcome-inner"><div style="font-size:78px">🔐</div><h1>Nouveau mot de passe</h1><p style="opacity:.85">Choisis un nouveau mot de passe pour ton compte Schutz app.</p>${authMessage?`<div class="auth-error">${esc(authMessage)}</div>`:""}<input id="resetPassword" type="password" placeholder="Nouveau mot de passe"><br><br><input id="resetPassword2" type="password" placeholder="Confirmer le mot de passe"><br><br><button class="btn" style="background:#fff;color:#4f46e5;width:100%" onclick="updatePassword()">Changer mon mot de passe 🔐</button></div></div>`}
function switchAuthMode(){
  authMode=authMode==="login"?"signup":"login";
  authMessage="";
  render();
}

function authPage(){
  const signup=authMode==="signup";
  return `<div class="welcome"><div class="welcome-inner">
    <div style="font-size:78px">🚀</div>
    <h1>${signup?"Créer ton compte":"Connexion"}</h1>
    <p style="opacity:.85">${signup?"Tes cartes seront sauvegardées sur schutz-app.fr et liées à ton compte.":"Retrouve tes cartes, tes cours et ta progression depuis n'importe quel appareil."}</p>
    ${authMessage?`<div class="auth-error">${esc(authMessage)}</div>`:""}
    ${signup?`<input id="authPseudo" placeholder="Ton pseudo (ex: Gwendal_Maths ⚡️)" autocomplete="nickname"><br><br>`:""}
    <input id="authEmail" type="email" placeholder="Ton adresse email" autocomplete="email"><br><br>
    <input id="authPassword" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="${signup?"new-password":"current-password"}"><br><br>
    <button class="btn" style="background:#fff;color:#4f46e5;width:100%" onclick="${signup?"signUpAccount()":"signInAccount()"}">${signup?"Créer mon compte 🚀":"Me connecter 🔐"}</button>
    ${!signup?`<button class="auth-switch" onclick="requestPasswordReset()">Mot de passe oublié ?</button>`:""}
    <button class="auth-switch" onclick="switchAuthMode()">${signup?"J'ai déjà un compte → Se connecter":"Créer un compte →"}</button>
    <p style="font-size:12px;opacity:.7;margin-top:18px">☁️ Sauvegarde automatique : tes cartes et ta progression sont enregistrées sur ton compte.</p>
  </div></div>`;
}

async function syncAvatarToLeaderboard(){
  if(!supabaseClient || !authUser) return;
  const {error}=await supabaseClient.from("leaderboard").update({avatar_url:state.avatarUrl||null}).eq("user_id",authUser.id);
  if(error) console.warn("Avatar classement:",error.message);
}

function storageErrorMessage(bucket,error){
  const msg=String(error?.message||error||'Erreur Storage');
  if(/bucket not found|not found/i.test(msg)) return `Le stockage « ${bucket} » n'est pas créé dans Supabase. Lance le fichier SUPABASE_V21_COMPLETE.sql fourni avec cette version.`;
  if(/row-level security|policy|not authorized|permission/i.test(msg)) return `Accès refusé au stockage « ${bucket} ». La migration Supabase V21 doit être exécutée avec le compte administrateur.`;
  return msg;
}
async function uploadProfileAvatar(){
  if(!supabaseClient || !authUser) return;
  const input=document.getElementById("profileAvatarFile");
  const file=input?.files?.[0];
  if(!file){showToast("Choisis une photo de profil.");return}
  if(!file.type.startsWith("image/")){showToast("Choisis une image.");return}
  if(file.size>5*1024*1024){showToast("Photo trop lourde : 5 Mo maximum.");return}
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=authUser.id+"/avatar-"+Date.now()+"."+ext;
  const oldPath=state.avatarPath||"";
  const {error}=await supabaseClient.storage.from("profile-avatars").upload(path,file,{contentType:file.type,upsert:false,cacheControl:"3600"});
  if(error){showToast(storageErrorMessage("profile-avatars",error));return}
  const {data}=supabaseClient.storage.from("profile-avatars").getPublicUrl(path);
  state.avatarUrl=data.publicUrl;
  state.avatarPath=path;
  saveLocal();
  await cloudSaveAll();
  await publishScore();
  await syncAvatarToLeaderboard();
  if(oldPath && oldPath!==path) await supabaseClient.storage.from("profile-avatars").remove([oldPath]);
  showToast("Photo de profil mise à jour ✅");
  render();
}

async function removeProfileAvatar(){
  if(!supabaseClient || !authUser) return;
  const oldPath=state.avatarPath||"";
  state.avatarUrl=""; state.avatarPath="";
  saveLocal(); await cloudSaveAll(); await publishScore(); await syncAvatarToLeaderboard();
  if(oldPath) await supabaseClient.storage.from("profile-avatars").remove([oldPath]);
  showToast("Photo de profil supprimée."); render();
}

async function publishScore(){
  if(!supabaseClient || !state.pseudo) return;
  const pseudo=state.pseudo.trim();
  if(!pseudo) return;
  try{
    const {error}=await supabaseClient.rpc("publish_leaderboard",{
      p_pseudo:pseudo,
      p_score:Math.max(0,Math.floor(Number(state.score)||0)),
      p_streak:Math.max(1,Math.floor(Number(state.streak)||1))
    });
    if(error) throw error;
    remoteError="";
  }catch(e){
    remoteError=e?.message||"Erreur classement";
  }
}

async function refreshLeaderboard(){
  if(!supabaseClient){remoteLeaderboard=[];return}
  remoteBusy=true;
  try{
    const {data,error}=await supabaseClient
      .from("leaderboard")
      .select("pseudo,score,streak,updated_at,avatar_url")
      .order("score",{ascending:false})
      .limit(100);
    if(error) throw error;
    remoteLeaderboard=Array.isArray(data)?data:[];
    remoteError="";
  }catch(e){
    remoteError=e?.message||"Impossible de charger le classement";
    remoteLeaderboard=[];
  }finally{
    remoteBusy=false;
    if(tab==="leader") render();
  }
}

function remoteStatusText(){
  if(!remoteEnabled) return "Classement partagé non configuré — mode local pour le moment.";
  if(remoteBusy) return "Synchronisation du classement…";
  if(remoteError) return "Classement distant indisponible : "+remoteError;
  return "Classement partagé en direct entre les joueurs.";
}

function uid(){return crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random()}
let cloudSaveTimer=null;
let cloudSaveBusy=false;

function scheduleCloudSave(){
  if(!remoteEnabled || !authUser) return;
  if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(async ()=>{
    cloudSaveTimer=null;
    if(cloudSaveBusy || !authUser) return;
    cloudSaveBusy=true;
    try{
      await cloudSaveAll();
      await publishScore();
    }finally{
      cloudSaveBusy=false;
    }
  },350);
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  // Sauvegarde automatique : chaque modification importante est envoyée au cloud
  // sans bouton « synchroniser » à utiliser.
  scheduleCloudSave();
}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mathText(s){return esc(s).replace(/\n/g,"<br>")}
function courseById(id){return state.courses.find(x=>x.id===id)}
function deckById(id){for(const c of state.courses){const d=c.decks.find(x=>x.id===id);if(d)return d}}
function allCards(){return state.courses.flatMap(c=>c.decks.flatMap(d=>d.cards))}
function showToast(m){toastMsg=m;render();setTimeout(()=>{toastMsg="";render()},1800)}
async function syncMyLoyalty(){if(!supabaseClient||!authUser)return;const r=await supabaseClient.rpc('get_my_loyalty_stamps');if(!r.error&&typeof r.data==='number'){state.loyaltyStamps=Math.max(0,Math.min(6,r.data));saveLocal();render()}}
function setTab(t){tab=t;render();if(t==="leader")refreshLeaderboard();if(t==="shop"){loadMyOrders();syncMyLoyalty()}if(t==="profile")syncMyLoyalty()}
function updateStreak(){const today=new Date().toISOString().slice(0,10);if(state.lastActiveDate!==today){if(state.lastActiveDate){const a=new Date(state.lastActiveDate),b=new Date(today);const days=Math.round((b-a)/86400000);if(days===1)state.streak++;else if(days>1)state.streak=1}else state.streak=1;state.lastActiveDate=today;save()}}
updateStreak();


function cloudPayload(){
  return {
    pseudo:state.pseudo||"",
    score:Number(state.score)||0,
    streak:Number(state.streak)||1,
    lastActiveDate:state.lastActiveDate||"",
    courses:Array.isArray(state.courses)?state.courses:[],
    friends:Array.isArray(state.friends)?state.friends:[],
    loyaltyStamps:Number(state.loyaltyStamps)||0,
    stamps:Number(state.loyaltyStamps)||0,
    dsGrades:Array.isArray(state.dsGrades)?state.dsGrades:[],
    notes:Array.isArray(state.notes)?state.notes:[],
    sharedExercises:Array.isArray(state.sharedExercises)?state.sharedExercises:[],
    pdfs:Array.isArray(state.pdfs)?state.pdfs:[],
    dailyReminder:state.dailyReminder||{enabled:false,time:"18:00"},
    avatarUrl:state.avatarUrl||"",
    avatarPath:state.avatarPath||""
  };
}

async function cloudSaveAll(){
  if(!supabaseClient || !authUser) return;
  const {error}=await supabaseClient.rpc("save_my_player_data",{p_data:cloudPayload()});
  if(error) console.warn("Sauvegarde cloud:",error.message);
}

async function loadCloudData(){
  if(!supabaseClient || !authUser) return false;
  const {data,error}=await supabaseClient
    .from("player_data")
    .select("pseudo,data")
    .eq("user_id",authUser.id)
    .maybeSingle();
  if(error){console.warn("Chargement cloud:",error.message);return false}
  if(data?.data){
    const cloud=data.data;
    if(cloud.pseudo) state.pseudo=cloud.pseudo;
    if(Array.isArray(cloud.courses)) state.courses=cloud.courses;
    if(Array.isArray(cloud.friends)) state.friends=cloud.friends;
    if(typeof cloud.loyaltyStamps==="number") state.loyaltyStamps=cloud.loyaltyStamps; else if(typeof cloud.stamps==="number") state.loyaltyStamps=cloud.stamps;
    if(Array.isArray(cloud.dsGrades)) state.dsGrades=cloud.dsGrades;
    if(Array.isArray(cloud.notes)) state.notes=cloud.notes;
    if(Array.isArray(cloud.sharedExercises)) state.sharedExercises=cloud.sharedExercises;
    if(Array.isArray(cloud.pdfs)) state.pdfs=cloud.pdfs;
    if(cloud.dailyReminder) state.dailyReminder=cloud.dailyReminder;
    if(typeof cloud.avatarUrl==="string") state.avatarUrl=cloud.avatarUrl;
    if(typeof cloud.avatarPath==="string") state.avatarPath=cloud.avatarPath;
    if(typeof cloud.score==="number") state.score=cloud.score;
    if(typeof cloud.streak==="number") state.streak=cloud.streak;
    if(cloud.lastActiveDate) state.lastActiveDate=cloud.lastActiveDate;
    saveLocal();
    return true;
  }
  // New account: preserve any cards created before account creation and upload them.
  if(state.pseudo || state.courses.length || state.score){
    await cloudSaveAll();
    return true;
  }
  return false;
}

async function migrateLocalDataToCloud(){
  if(!supabaseClient || !authUser) return;
  await cloudSaveAll();
}

async function initAuth(){
  if(!supabaseClient){authLoading=false;return}
  const recoveryRequested=()=>{
    const params=new URLSearchParams(location.search);
    const hash=String(location.hash||"");
    return params.get("reset")==="1" || params.has("code") || hash.includes("type=recovery") || hash.includes("access_token=");
  };
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    authUser=session?.user||null;
    if(event==="PASSWORD_RECOVERY" || recoveryRequested()){
      resetMode=true;
      authMessage="";
      render();
      return;
    }
    if(authUser && !resetMode){
      setTimeout(async()=>{await loadCloudData();await syncMyLoyalty();render();handlePendingDeckShare()},0);
    }else if(!authUser && !resetMode){render()}
  });
  const {data,error}=await supabaseClient.auth.getSession();
  if(error) console.warn("Session auth:",error.message);
  authUser=data?.session?.user||null;
  if(recoveryRequested()){
    resetMode=true;
    authLoading=false;
    render();
    return;
  }
  if(authUser && !resetMode){
    await loadCloudData();
    await syncMyLoyalty();
    if(!state.pseudo){const p=authUser.user_metadata?.pseudo||"";if(p){state.pseudo=p;saveLocal();await cloudSaveAll()}}
  }
  authLoading=false;
  render();
}

const promptText=`Agis en tant qu'expert pédagogique et professeur agrégé. À partir du cours que je vais te fournir, génère des flashcards au format strict suivant pour l'application schutz-app.fr. Utilise la syntaxe LaTeX entre symboles $ pour toutes les formules mathématiques ou scientifiques.

Format exact attendu pour chaque carte :
Q: [Question claire et précise]
R: [Réponse détaillée avec LaTeX ($...$)]
---

Génère entre 10 et 20 cartes de haute qualité sur le cours suivant :
[Insère ton cours ici]`;
function openAIPrompt(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Prompt IA 🤖</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">Copie ce prompt et envoie-le à ChatGPT avec ton cours pour obtenir directement tes cartes prêtes à être importées.</p><textarea id="promptBox" readonly>${esc(promptText)}</textarea><button class="btn primary full" onclick="navigator.clipboard.writeText(promptText);showToast('Copié ! ✅')">📋 Copier le prompt</button></div></div>`;render()}

function openImport(did){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Importation 🤖</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">📋 Colle ici le texte ou le code de partage reçu par un pote schutz-app.fr.</p><button class="btn secondary" onclick="pasteImport()">📋 Coller depuis le Presse-papier</button><textarea id="importText" placeholder="Q: ...\nR: ...\n---"></textarea><div id="kbd"></div><button class="btn primary full" onclick="processImport('${did}')">🚀 Générer les cartes</button></div></div>`;render();setKeyboard("importText")}
async function pasteImport(){try{document.getElementById("importText").value=await navigator.clipboard.readText()}catch{showToast("Impossible d'accéder au presse-papier")}}
function processImport(did){const raw=document.getElementById("importText").value;const blocks=raw.split(/(?=Q\s*:)/i).filter(x=>/^Q\s*:/i.test(x.trim()));let count=0;for(const block of blocks){const m=block.match(/^Q\s*:\s*([\s\S]*?)\s+R\s*:\s*([\s\S]*?)(?:\s*---|$)/i);if(m&&m[1].trim()&&m[2].trim()){deckById(did).cards.push(newCard(m[1].trim(),m[2].trim()));count++}}save();closeModal();openDeck(did);showToast(`${count} carte(s) ajoutée(s) avec succès ! 🎉`)}

function encodeDeckShare(d){
  const payload={v:1,name:d.name,cards:d.cards.map(c=>({frontText:c.frontText,backText:c.backText}))};
  return LZString.compressToEncodedURIComponent(JSON.stringify(payload));
}
function decodeDeckShare(code){try{const p=JSON.parse(LZString.decompressFromEncodedURIComponent(code));if(!p||!Array.isArray(p.cards))throw new Error();return p}catch{return null}}
function shareDeck(did){
  const d=deckById(did),code=encodeDeckShare(d),url=location.origin+location.pathname+'#deck='+code;
  modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Partager « ${esc(d.name)} » 📱</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">Ton pote peut scanner ce QR avec l'appareil photo de son téléphone. Le paquet sera proposé automatiquement dans Schutz app.</p><div id="deckQR" style="display:flex;justify-content:center;padding:18px"></div><button class="btn primary full" onclick="navigator.clipboard.writeText('${url}');showToast('Lien copié ! 📋')">📋 Copier le lien</button><button class="btn secondary full" style="margin-top:8px" onclick="directShareDeck('${encodeURIComponent(url)}','${encodeURIComponent(d.name)}')">📤 Partager directement à un ami</button><p class="sub" style="margin-top:12px;word-break:break-all">${esc(url)}</p></div></div>`;
  render();setTimeout(()=>{const q=document.getElementById('deckQR');if(q)new QRCode(q,{text:url,width:250,height:250,correctLevel:QRCode.CorrectLevel.M})},0);
}
async function directShareDeck(encodedUrl,encodedName){const url=decodeURIComponent(encodedUrl),name=decodeURIComponent(encodedName);if(navigator.share){try{await navigator.share({title:'Deck Schutz app — '+name,text:'Je te partage ce deck Schutz app 📚',url});}catch(e){}}else{await navigator.clipboard.writeText(url);showToast('Lien copié : envoie-le à ton ami 📋')}}

function handlePendingDeckShare(){
  const hash=location.hash||'';if(!hash.startsWith('#deck='))return;
  const p=decodeDeckShare(hash.slice(6));if(!p)return;
  sessionStorage.setItem('pendingDeckShare',JSON.stringify(p));history.replaceState(null,'',location.pathname+location.search);
  setTimeout(()=>{const pending=JSON.parse(sessionStorage.getItem('pendingDeckShare')||'null');if(!pending)return;modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Paquet reçu 📚</h2><button class="close" onclick="sessionStorage.removeItem('pendingDeckShare');closeModal()">×</button></div><p>Tu as reçu le paquet <b>${esc(pending.name||'sans nom')}</b> avec ${pending.cards.length} carte(s).</p><button class="btn primary full" onclick="importPendingDeckShare()">➕ Ajouter à mes cartes</button><button class="btn gray full" style="margin-top:8px" onclick="sessionStorage.removeItem('pendingDeckShare');closeModal()">Annuler</button></div></div>`;render()},250);
}
function importPendingDeckShare(){
  const p=JSON.parse(sessionStorage.getItem('pendingDeckShare')||'null');if(!p)return;let c=state.courses[0];if(!c){c={id:uid(),name:'Paquets partagés',desc:'Paquets reçus par QR code',decks:[]};state.courses.push(c)}
  const base=p.name||'Paquet partagé';let deckName=base,n=2;while(c.decks.some(d=>d.name===deckName)){deckName=`${base} (${n++})`}
  c.decks.push({id:uid(),name:deckName,cards:p.cards.map(x=>newCard(String(x.frontText||''),String(x.backText||'')))});sessionStorage.removeItem('pendingDeckShare');save();closeModal();showToast('Paquet ajouté ! 🎉');
}

function renderChrono(){const d=deckById(quiz.did), cards=d.cards;modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Test Chrono ⏱️⚡️</h2><button class="close" onclick="closeModal()">×</button></div>${quiz.finished?`<div style="text-align:center;padding:30px"><div style="font-size:80px">🏆</div><h2>Session Chrono Terminée ! 🎉</h2><p>Ton score : ${quiz.score} / ${cards.length} 🎯</p><p class="success"><b>+${quiz.score*10} points enregistrés ! 🚀</b></p><button class="btn primary" onclick="closeModal()">Terminer 🚀</button></div>`:`<div class="row between"><b class="${quiz.time<=5?'danger':'orange'}">⏱️ Chrono : ${quiz.time}s</b><b class="muted">🎯 Q ${quiz.index+1} / ${cards.length}</b></div><div class="progress" style="margin:12px 0"><div style="width:${quiz.index/cards.length*100}%"></div></div><div class="card math center" style="min-height:90px">${mathText(cards[quiz.index].frontText)}</div>${quiz.options.map(o=>`<button class="option ${quiz.selected?(o===cards[quiz.index].backText?'correct':o===quiz.selected?'wrong':''):""}" onclick="answerQuiz('${encodeURIComponent(o)}')" ${quiz.selected?'disabled':''}><span class="math">${mathText(o)}</span></button>`).join("")}`}</div></div>`;render();if(!quiz.finished&&!quiz.options){setupQuiz();}}
function setupQuiz(){const cards=deckById(quiz.did).cards,current=cards[quiz.index];const inc=cards.filter(x=>x.id!==current.id).map(x=>x.backText).sort(()=>Math.random()-.5).slice(0,3);quiz.options=[...inc,current.backText].sort(()=>Math.random()-.5);quiz.time=15;renderChrono();if(timer)clearInterval(timer);timer=setInterval(()=>{if(quiz.selected||quiz.finished)return;if(quiz.time>0){quiz.time--;renderChrono()}else{answerQuiz(encodeURIComponent("TIMEOUT_WRONG"))}},1000)}
function answerQuiz(encoded){if(quiz.selected)return;const option=decodeURIComponent(encoded),correct=deckById(quiz.did).cards[quiz.index].backText;quiz.selected=option;if(option===correct)quiz.score++;renderChrono();setTimeout(()=>{if(quiz.index+1<deckById(quiz.did).cards.length){quiz.index++;quiz.selected=null;quiz.options=null;setupQuiz()}else{quiz.finished=true;state.score+=quiz.score*10;save();renderChrono();clearInterval(timer);timer=null}},800)}

function renderReview(){const cards=review.free?allCards():allCards().filter(c=>new Date(c.dueDate)<=new Date());if(review.index>=cards.length){document.getElementById("reviewArea").innerHTML=`<div class="empty"><div style="font-size:70px">🎉</div><h2>Session terminée avec succès !</h2><button class="btn primary" onclick="review={free:false,index:0};render()">Recommencer une session</button></div>`;return}const c=cards[review.index];document.getElementById("reviewArea").innerHTML=`<div class="progress"><div style="width:${review.index/cards.length*100}%"></div></div><p class="sub">🎯 Carte ${review.index+1} / ${cards.length} ${review.free?"(Mode Libre)":""}</p><div class="card math center" style="min-height:90px">${mathText(c.frontText)}</div>${review.revealed?`<div class="card math center" style="min-height:90px;background:#dcfce7">${mathText(c.backText)}</div><div class="grid2">${["again","hard","good","easy"].map(x=>`<button class="btn ${x==='again'?'red':x==='hard'?'orange':x==='good'?'primary':'green'}" onclick="rateCard('${x}')">${{again:"Oublié",hard:"Difficile",good:"Correct",easy:"Facile"}[x]}</button>`).join("")}</div>`:`<button class="btn primary full" onclick="review.revealed=true;renderReview()">👀 Révéler la réponse</button>`}`;if(window.MathJax)MathJax.typesetPromise().catch(()=>{})}
function rateCard(r){const cards=review.free?allCards():allCards().filter(c=>new Date(c.dueDate)<=new Date()),c=cards[review.index];const result=fsrsEvaluate(c,r);Object.assign(c,result);c.reps++;if(r==="again")c.lapses++;c.reviewLogs.push({date:new Date().toISOString(),rating:r});if(!review.free) state.score+=10;save();review.index++;review.revealed=false;render()}
function fsrsEvaluate(c,r){const w=[.4,.6,2.4,5.8,4.93,.94,.86,.01,1.49,.14,.94,2.18,.05,.34,1.26,.29,2.61], rating={again:1,hard:2,good:3,easy:4}[r],stateRaw=c.fsrsStateRaw;const last=c.lastReviewDate?new Date(c.lastReviewDate):null;const elapsed=last?Math.max(0,(Date.now()-last)/86400000):0;const retr=c.stability>0?Math.pow(1+elapsed/(9*c.stability),-1):0;let d=c.difficulty,s=c.stability,ns=stateRaw;const initD=Math.min(Math.max(w[4]-(rating-3)*w[5],1),10);const calcD=(cur,rt)=>Math.min(Math.max(cur-w[6]*(rt-3)+w[7]*(initD-(cur-w[6]*(rt-3))),1),10);d=calcD(d,rating);const initS=Math.max(.1,w[rating-1]);if(stateRaw===0){s=initS;ns=rating===1?1:2}else if(stateRaw===1||stateRaw===3){if(rating===1){s=initS;ns=3}else{s=recallS(d,s,retr,rating,w);ns=2}}else{if(rating===1){s=forgetS(d,s,retr,w);ns=3}else{s=recallS(d,s,retr,rating,w);ns=2}}const interval=(ns===1||ns===3)?(rating===1?5/1440:15/1440):Math.max(1,s*(Math.pow(.9,-1)-1)*9);return{difficulty:d,stability:s,fsrsStateRaw:ns,lastReviewDate:new Date().toISOString(),dueDate:new Date(Date.now()+interval*86400000).toISOString()}}
function recallS(d,s,r,rt,w){const hp=rt===2?w[15]:1,eb=rt===4?w[16]:1;return Math.max(.1,s*(1+Math.exp(w[8])*(11-d)*Math.pow(s,-w[9])*(Math.exp((1-r)*w[10])-1)*hp*eb))}
function forgetS(d,s,r,w){return Math.min(s,Math.max(.1,w[11]*Math.pow(d,-w[12])*(Math.pow(s+1,w[13])-1)*Math.exp((1-r)*w[14])))}

function setKeyboard(id){const k=document.getElementById("kbd");if(!k)return;k.innerHTML=`<div class="keyboard"><div id="kr"></div><div class="row"><button class="key wide" onclick="toggleSymbols('${id}')">$ LaTeX 🔢</button><button class="space" onclick="insertKey('${id}',' ')">espace ␣</button><button class="key wide" onclick="backspace('${id}')">⌫</button></div></div>`;buildKeys(id,false)}
function buildKeys(id,symbols){const rows=symbols?[["1","2","3","4","5","6","7","8","9","0"],["$","\\\\","+","-","*","/","=","(",")","%"],[".",",","?","!",":",";","'","_","^","{","}"]]:[["a","z","e","r","t","y","u","i","o","p"],["q","s","d","f","g","h","j","k","l","m"],["w","c","v","b","n"]];document.getElementById("kr").innerHTML=rows.map(row=>`<div class="keyrow">${row.map(k=>`<button class="key" onclick="insertKey('${id}','${k.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}')">${symbols?k:k.toUpperCase()}</button>`).join("")}</div>`).join("")}
function toggleSymbols(id){const kr=document.getElementById("kr");buildKeys(id,kr.dataset.sym!=="1");kr.dataset.sym=kr.dataset.sym==="1"?"0":"1"}
function insertKey(id,k){const e=document.getElementById(id);if(e)e.value+=k}
function backspace(id){const e=document.getElementById(id);if(e)e.value=e.value.slice(0,-1)}

function openReportForm(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>🐞 Signaler un problème</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">Ton retour sera envoyé à l’équipe Schutz app.</p><input id="reportSubject" placeholder="Sujet (ex : cartes disparues)"><select id="reportType"><option>Bug</option><option>Problème de compte</option><option>Problème de paiement / commande</option><option>Suggestion</option><option>Autre</option></select><textarea id="reportMessage" rows="7" placeholder="Décris le problème le plus précisément possible…"></textarea><button class="btn red full" onclick="submitReport()">📩 Envoyer le signalement</button></div></div>`;render()}
async function submitReport(){const subject=document.getElementById('reportSubject').value.trim(),type=document.getElementById('reportType').value,message=document.getElementById('reportMessage').value.trim();if(!message){showToast('Décris le problème avant d’envoyer.');return}try{const res=await fetch('/.netlify/functions/send-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject,type,message,pseudo:state.pseudo,email:authUser?.email||''})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Impossible d’envoyer le signalement.');closeModal();showToast('Signalement envoyé à l’équipe ✅')}catch(e){showToast(e.message||'Erreur d’envoi')}}

async function openAdminPanel(){if(!supabaseClient||!authUser){showToast('Connexion requise');return}const check=await adminRpcSafe('is_shop_staff');if(check.error||check.data!==true){showToast('Accès administrateur refusé');return}modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Administration 🛡️</h2><button class="close" onclick="closeModal()">×</button></div><p class="sub">Gère les profils, les tampons et toutes les commandes récentes.</p><div class="section-title">🍵 Cartes de fidélité</div><div id="adminUsers">Chargement…</div><div class="section-title">👑 Rôles</div><div id="adminRoles">Chargement…</div><div class="section-title">📦 Commandes</div><div id="adminOrders">Chargement…</div></div></div>`;render();loadAdminUsers();loadAdminRoles();loadAdminOrders();clearInterval(window.adminRefreshTimer);window.adminRefreshTimer=setInterval(()=>{if(document.getElementById('adminOrders'))loadAdminOrders()},20000)}
async function adminRpcSafe(fn,args,ms=10000){return await Promise.race([supabaseClient.rpc(fn,args),new Promise(resolve=>setTimeout(()=>resolve({error:{message:'Le serveur ne répond pas après 10 secondes. Réessaie.'}}),ms))])}
async function loadAdminUsers(){const box=document.getElementById('adminUsers');if(!box)return;const {data,error}=await adminRpcSafe('admin_list_players');if(error){box.innerHTML='<div class="auth-error">'+esc(error.message)+'</div>';return}box.innerHTML=(data||[]).map(u=>`<div class="card"><div class="row">${u.avatar_url?`<img src="${esc(u.avatar_url)}" style="width:42px;height:42px;border-radius:50%;object-fit:cover">`:`<div class="iconbox">👤</div>`}<div class="main"><b>${esc(u.pseudo||'Sans pseudo')}</b><div class="mini">${esc(u.user_id)} · ${u.score||0} pts · 🍵 ${u.stamps||0}/6 · ${esc(u.email||'')}</div></div></div><input id="ap-${u.user_id}" value="${esc(u.pseudo||'')}" placeholder="Pseudo"><input id="as-${u.user_id}" type="number" min="0" max="6" value="${Number(u.stamps||0)}" placeholder="Tampons (0 à 6)" style="margin-top:6px"><button class="btn primary full" style="margin-top:6px" onclick="adminSaveUser('${u.user_id}')">Enregistrer</button></div>`).join('')||'<div class="empty">Aucun compte utilisateur.</div>'}
async function adminSaveUser(id){const btn=document.querySelector(`[onclick="adminSaveUser('${id}')"]`);if(btn){btn.disabled=true;btn.textContent='Enregistrement…'}const pseudo=document.getElementById('ap-'+id)?.value.trim()||'Champion';const stamps=Math.max(0,Math.min(6,Number(document.getElementById('as-'+id)?.value||0)));try{const r=await adminRpcSafe('admin_update_player',{p_user_id:id,p_pseudo:pseudo,p_stamps:stamps});if(r.error){showToast('Enregistrement : '+r.error.message);return}showToast('Profil + tampons enregistrés : '+stamps+'/6 🍵');await loadAdminUsers();if(authUser?.id===id){await loadCloudData();render()}}finally{if(btn){btn.disabled=false;btn.textContent='Enregistrer'}}}
function orderStatusMeta(s){
  const map={
    awaiting_payment:{label:'💳 En attente de paiement',short:'Paiement',tone:'orange'},
    paid:{label:'💰 Payée',short:'Payée',tone:'green'},
    preparing:{label:'📦 En préparation',short:'Préparation',tone:'purple'},
    shipped:{label:'🚚 Expédiée',short:'Expédiée',tone:'primary'},
    delivered:{label:'✅ Livrée',short:'Livrée',tone:'green'},
    cancelled:{label:'❌ Annulée',short:'Annulée',tone:'red'},
    // Compatibilité avec les anciennes commandes.
    pending:{label:'💳 En attente de paiement',short:'Paiement',tone:'orange'},
    repair:{label:'📦 En préparation',short:'Préparation',tone:'purple'},
    validated:{label:'✅ Livrée',short:'Livrée',tone:'green'}
  };
  return map[s]||{label:'❓ Statut inconnu',short:'Inconnu',tone:'gray'};
}
function orderStatusLabel(s){return orderStatusMeta(s).label}
function orderStatusOptions(current){
  const statuses=[['awaiting_payment','💳 En attente de paiement'],['paid','💰 Payée'],['preparing','📦 En préparation'],['shipped','🚚 Expédiée'],['delivered','✅ Livrée'],['cancelled','❌ Annulée']];
  return statuses.map(([v,l])=>`<option value="${v}" ${v===current?'selected':''}>${l}</option>`).join('');
}
async function loadAdminRoles(){
  const box=document.getElementById('adminRoles'); if(!box)return;
  const me=await adminRpcSafe('is_shop_admin');
  if(me.error||me.data!==true){box.innerHTML='<div class="sub">Seul un administrateur peut nommer ou retirer des rôles.</div>';return}
  const r=await adminRpcSafe('admin_list_roles');
  if(r.error){box.innerHTML='<div class="auth-error">'+esc(r.error.message)+'</div>';return}
  box.innerHTML=(r.data||[]).map(u=>`<div class="card"><div class="row"><div class="main"><b>${esc(u.pseudo||'Sans pseudo')}</b><div class="mini">${esc(u.email||'')} · ${esc(u.role||'user')}</div></div><select id="role-${u.user_id}" style="max-width:150px"><option value="user" ${u.role==='user'?'selected':''}>Utilisateur</option><option value="moderator" ${u.role==='moderator'?'selected':''}>Modo</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></div><button class="btn purple full" style="margin-top:8px" onclick="adminSaveRole('${u.user_id}')">Enregistrer le rôle</button></div>`).join('')||'<div class="empty">Aucun compte.</div>';
}
async function adminSaveRole(id){const role=document.getElementById('role-'+id)?.value||'user';const r=await adminRpcSafe('admin_set_user_role',{p_user_id:id,p_role:role});if(r.error){showToast('Rôle : '+r.error.message);return}showToast('Rôle enregistré : '+role+' ✅');await loadAdminRoles();}
function adminOrderCard(o){
  const items=Array.isArray(o.items)?o.items:[];
  const total=Number(o.total||0).toFixed(2);
  const created=o.created_at?new Date(o.created_at).toLocaleString('fr-FR'):'—';
  return `<div class="card admin-order" data-order-id="${esc(o.id)}">
    <div class="row between" style="gap:10px;align-items:flex-start">
      <div class="main"><b>📦 ${esc(o.customer_name||o.pseudo||'Client')}</b><div class="mini">Commande #${esc(String(o.id||'').slice(0,8))} · ${created}</div></div>
      <span class="pill">${orderStatusLabel(o.status)}</span>
    </div>
    <div class="mini" style="margin-top:8px">👤 ${esc(o.pseudo||'—')} · ✉️ ${esc(o.customer_email||'—')}</div>
    <p>📍 <b>${esc(o.address||'—')}</b>, ${esc(o.city||'—')}</p>
    <p>💶 <b>${total} €</b></p>
    <div class="sub">🛒 ${items.map(i=>`${esc(i.name)} × ${Number(i.qty)||0}`).join(' · ')||'—'}</div>
    ${o.note?`<p class="sub">📝 ${esc(o.note)}</p>`:''}
    <div class="grid2" style="margin-top:10px">
      <select id="status-${esc(o.id)}" aria-label="Statut de la commande">${orderStatusOptions(o.status)}</select>
      <button class="btn primary" onclick="adminChangeOrder('${esc(o.id)}',document.getElementById('status-${esc(o.id)}').value)">💾 Enregistrer</button>
    </div>
    <button class="btn red full" style="margin-top:8px" onclick="adminDeleteOrder('${esc(o.id)}')">🗑️ Supprimer la commande</button>
  </div>`;
}
async function loadAdminOrders(){
  const box=document.getElementById('adminOrders');
  if(!box)return;
  box.innerHTML='<div class="empty">Chargement des commandes…</div>';
  let result=await adminRpcSafe('admin_list_orders');
  // Secours utile si PostgREST a un cache de fonction ancien : on tente la lecture directe.
  if(result.error){
    const fallback=await supabaseClient.from('shop_orders').select('id,user_id,pseudo,customer_name,customer_email,address,city,items,total,note,status,created_at,updated_at').order('created_at',{ascending:false});
    if(!fallback.error){result={data:fallback.data,error:null};}
  }
  if(result.error){
    box.innerHTML='<div class="auth-error"><b>Impossible de charger les commandes</b><br>'+esc(result.error.message||'Erreur inconnue')+'<br><small>Si tu viens de lancer la migration Supabase, recharge la page puis réessaie.</small></div>';
    return;
  }
  const orders=Array.isArray(result.data)?result.data:[];
  box.innerHTML=`<div class="row between" style="margin-bottom:10px"><b>${orders.length} commande(s)</b><button class="btn secondary small" onclick="loadAdminOrders()">🔄 Actualiser</button></div>${orders.map(adminOrderCard).join('')||'<div class="empty">Aucune commande pour le moment.</div>'}`;
}
async function adminChangeOrder(id,status){
  const r=await adminRpcSafe('admin_update_order_status',{p_order_id:id,p_status:status});
  if(r.error){showToast('Commande : '+r.error.message);return}
  const o=r.data?.[0];
  if(o){
    try{
      const res=await fetch('/.netlify/functions/send-order-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:o.customer_email,name:o.customer_name,pseudo:o.pseudo,status:o.status,orderId:id})});
      const d=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(d.error||'Mail client non envoyé');
    }catch(e){
      showToast('Statut enregistré, mais mail non envoyé : '+e.message);
      await loadAdminOrders();
      return;
    }
  }
  showToast('Commande mise à jour : '+orderStatusLabel(status));
  await loadAdminOrders();
}
async function adminDeleteOrder(id){
  if(!confirm('Supprimer définitivement cette commande ? Cette action est irréversible.'))return;
  const r=await adminRpcSafe('admin_delete_order',{p_order_id:id});
  if(r.error){showToast('Suppression : '+r.error.message);return}
  showToast('Commande supprimée 🗑️');
  await loadAdminOrders();
}
function openGrades(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Notes de DS 📈</h2><button class="close" onclick="closeModal()">×</button></div><div class="grade-grid">${state.dsGrades.map((g,i)=>`<div class="card"><b>${esc(g.name)}</b><div>${g.grade}/${g.max}</div><button class="btn gray small" onclick="deleteGrade(${i})">Supprimer</button></div>`).join('')}</div><input id="gName" placeholder="DS Maths"><input id="gGrade" type="number" step="0.1" placeholder="Note obtenue" style="margin-top:8px"><input id="gMax" type="number" step="0.1" value="20" placeholder="Barème" style="margin-top:8px"><button class="btn primary full" style="margin-top:8px" onclick="addGrade()">＋ Ajouter</button><div class="card"><b>Évolution</b><div style="height:180px;display:flex;align-items:end;gap:8px">${state.dsGrades.map(g=>{const h=Math.max(8,Math.min(100,(Number(g.grade)/Number(g.max||20))*100));return `<div title="${esc(g.name)}" style="flex:1;height:${h}%;background:#4f46e5;border-radius:8px 8px 2px 2px"></div>`}).join('')}</div></div></div></div>`;render()}
function addGrade(){const n=document.getElementById('gName').value.trim(),g=Number(document.getElementById('gGrade').value),m=Number(document.getElementById('gMax').value||20);if(!n||!Number.isFinite(g)||!m)return;state.dsGrades.push({name:n,grade:g,max:m,date:new Date().toISOString()});save();cloudSaveAll();openGrades()}function deleteGrade(i){state.dsGrades.splice(i,1);save();cloudSaveAll();openGrades()}
function openNotes(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Pense-bête / Cahier de texte 📝</h2><button class="close" onclick="closeModal()">×</button></div>${state.notes.map((n,i)=>`<div class="list-item"><div class="main"><b>${esc(n.title)}</b><div class="sub">${esc(n.text)}</div></div><button class="btn gray small" onclick="deleteNote(${i})">×</button></div>`).join('')}<input id="nTitle" placeholder="Titre"><textarea id="nText" placeholder="Travail à faire, devoir, rappel…" style="min-height:100px;margin-top:8px"></textarea><button class="btn primary full" onclick="addNote()">＋ Ajouter</button></div></div>`;render()}
function addNote(){const t=document.getElementById('nTitle').value.trim(),x=document.getElementById('nText').value.trim();if(!t||!x)return;state.notes.push({title:t,text:x,date:new Date().toISOString()});save();cloudSaveAll();openNotes()}function deleteNote(i){state.notes.splice(i,1);save();cloudSaveAll();openNotes()}
function openStudyTimer(){let seconds=25*60;modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Timer de révision ⏱️</h2><button class="close" onclick="clearInterval(window.studyTimerInterval);closeModal()">×</button></div><div id="studyTimerValue" class="timer-big">25:00</div><div class="grid2"><button class="btn primary" onclick="startStudyTimer()">▶️ Démarrer</button><button class="btn gray" onclick="resetStudyTimer()">↺ Reset</button></div></div></div>`;window.studyTimerSeconds=seconds;render()}
function startStudyTimer(){clearInterval(window.studyTimerInterval);window.studyTimerInterval=setInterval(()=>{window.studyTimerSeconds=Math.max(0,window.studyTimerSeconds-1);const e=document.getElementById('studyTimerValue');if(e)e.textContent=fmtTimer(window.studyTimerSeconds);if(window.studyTimerSeconds===0){clearInterval(window.studyTimerInterval);showToast('Session terminée ! 🎉')}},1000)}function resetStudyTimer(){window.studyTimerSeconds=25*60;const e=document.getElementById('studyTimerValue');if(e)e.textContent='25:00'}function fmtTimer(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function openPdfManager(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>PDF de cours 📄</h2><button class="close" onclick="closeModal()">×</button></div><input id="pdfFile" type="file" accept="application/pdf"><input id="pdfName" placeholder="Nom du cours / document" style="margin-top:8px"><button class="btn primary full" style="margin-top:8px" onclick="uploadCoursePdf()">⬆️ Déposer le PDF</button><div class="section-title">Mes PDF</div>${state.pdfs.map((f,i)=>`<div class="list-item"><div class="main"><b>${esc(f.name)}</b><div class="mini">${new Date(f.date).toLocaleDateString('fr-FR')}</div></div><button class="btn secondary small" onclick="openPdf('${encodeURIComponent(f.path)}')">Ouvrir</button><button class="btn red small" onclick="deleteCoursePdf(${i})">🗑️</button></div>`).join('')||'<div class="empty">Aucun PDF.</div>'}</div></div>`;render()}
async function uploadCoursePdf(){const file=document.getElementById('pdfFile')?.files?.[0],name=document.getElementById('pdfName')?.value.trim()||file?.name;if(!file||file.type!=='application/pdf'||!authUser){showToast('Choisis un PDF et vérifie ta connexion.');return}const path=authUser.id+'/'+uid()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await supabaseClient.storage.from('course-pdfs').upload(path,file,{contentType:'application/pdf',upsert:false});if(error){console.error('[course-pdfs]',error);showToast(storageErrorMessage('course-pdfs',error));return}state.pdfs.push({name,path,date:new Date().toISOString()});save();await cloudSaveAll();openPdfManager();showToast('PDF ajouté 📄')}
async function openPdf(encoded){const path=decodeURIComponent(encoded);const {data,error}=await supabaseClient.storage.from('course-pdfs').createSignedUrl(path,3600);if(error){showToast(error.message);return}window.open(data.signedUrl,'_blank')}
async function deleteCoursePdf(i){const f=state.pdfs?.[i];if(!f)return;if(!confirm(`Supprimer le PDF « ${f.name} » ?`))return;const {error}=await supabaseClient.storage.from('course-pdfs').remove([f.path]);if(error){showToast('Suppression : '+error.message);return}state.pdfs.splice(i,1);save();await cloudSaveAll();openPdfManager();showToast('PDF supprimé 🗑️')}
async function openExerciseSpace(){modal=`<div class="modal-back"><div class="modal"><div class="modal-head"><h2>Exercices communs 🤝</h2><button class="close" onclick="closeModal()">×</button></div><input id="exFile" type="file" accept=".pdf,image/*,.doc,.docx"><input id="exName" placeholder="Nom de l'exercice" style="margin-top:8px"><button class="btn primary full" style="margin-top:8px" onclick="uploadExercise()">⬆️ Déposer</button><div class="section-title">Fichiers partagés</div><div id="exerciseList">Chargement…</div></div></div>`;render();loadExercises()}
async function loadExercises(){const box=document.getElementById('exerciseList');if(!box)return;const {data,error}=await supabaseClient.storage.from('shared-exercises').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});if(error){console.error('[shared-exercises:list]',error);box.innerHTML='<div class="auth-error"><b>Impossible de lire le dépôt commun</b><br>'+esc(storageErrorMessage('shared-exercises',error))+'<br><small>Bucket utilisé : shared-exercises</small></div>';return}box.innerHTML=(data||[]).map(f=>`<div class="list-item"><div class="main"><b>${esc(f.name)}</b></div><button class="btn secondary small" onclick="openExercise('${encodeURIComponent(f.name)}')">Ouvrir</button><button class="btn red small" onclick="deleteExercise('${encodeURIComponent(f.name)}')">🗑️</button></div>`).join('')||'<div class="empty">Aucun exercice partagé.</div>'}
async function uploadExercise(){const file=document.getElementById('exFile')?.files?.[0],name=document.getElementById('exName')?.value.trim()||file?.name;if(!file||!authUser)return;const path=uid()+'-'+name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await supabaseClient.storage.from('shared-exercises').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(error){console.error('[shared-exercises:upload]',error);showToast(storageErrorMessage('shared-exercises',error));return}await loadExercises();showToast('Exercice partagé 🤝')}
async function openExercise(encoded){const path=decodeURIComponent(encoded);const {data}=supabaseClient.storage.from('shared-exercises').getPublicUrl(path);window.open(data.publicUrl,'_blank')}
async function deleteExercise(encoded){const path=decodeURIComponent(encoded);if(!confirm('Supprimer ce document partagé ?'))return;const {error}=await supabaseClient.storage.from('shared-exercises').remove([path]);if(error){showToast('Suppression : '+error.message);return}await loadExercises();showToast('Document supprimé 🗑️')}

initAuth();
